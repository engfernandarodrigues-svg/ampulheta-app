<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Ampulheta</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

  <h1>⏳ Ampulheta</h1>

  <div class="inputs">
    <input type="number" id="minutos" placeholder="Min" min="0">
    <input type="number" id="segundos" placeholder="Seg" min="0">
  </div>

  <div class="botoes">
    <button onclick="iniciar()">Iniciar</button>
    <button onclick="pausar()">Pausar</button>
    <button onclick="resetar()">Resetar</button>
  </div>

  <div id="tempo">00:00</div>

  <div class="ampulheta">
    <div class="topo" id="topo"></div>
    <div class="fundo" id="fundo"></div>
  </div>

</div>

<script src="script.js"></script>
</body>
</html>
