<!DOCTYPE html>
<html lang="pt-BR">
<head>

  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>Ampulheta Pro</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@300;400;600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">

</head>

<body>

<div class="bg"></div>

<div class="app">

  <!-- LOGO -->
  <div class="logo-wrap">
    <img src="./logo.png" class="logo">
  </div>

  <!-- MODOS -->
  <div class="mode-switch">

    <button class="mode active" onclick="setView('hourglass')">
      Ampulheta
    </button>

    <button class="mode" onclick="setView('circle')">
      Circular
    </button>

  </div>

  <!-- CARD VISUAL -->
  <div class="visual-card">

    <!-- AMPULHETA -->
    <div class="hourglass-view" id="hourglassView">

      <canvas id="hourglassCanvas" width="320" height="420"></canvas>

    </div>

    <!-- CIRCULAR -->
    <div class="circle-view hidden" id="circleView">

      <svg class="ring" width="300" height="300">

        <circle
          class="ring-bg"
          cx="150"
          cy="150"
          r="120">
        </circle>

        <circle
          class="ring-progress"
          cx="150"
          cy="150"
          r="120">
        </circle>

      </svg>

      <div class="circle-center">

        <div class="circle-time" id="circleTime">
          01:30
        </div>

      </div>

    </div>

    <!-- TEMPO -->
    <div class="main-time" id="display">
      01:30
    </div>

    <div class="time-labels">
      <span>MINUTOS</span>
      <span>SEGUNDOS</span>
    </div>

  </div>

  <!-- TEMPO FIXO -->
  <div class="time-pill">
    ⏱ 1:30
  </div>

  <!-- CONTROLES -->
  <div class="controls">

    <button class="control primary" onclick="iniciar()">
      ▶ Iniciar
    </button>

    <button class="control" onclick="pausar()">
      ❚❚ Pausar
    </button>

    <button class="control" onclick="resetar()">
      ↻ Resetar
    </button>

  </div>

  <!-- FOOTER -->
  <div class="footer-card">

    <div class="footer-icon">
      ✦
    </div>

    <div>
      <h3>Foco, disciplina e automação</h3>
      <p>Transforme processos em resultados.</p>
    </div>

  </div>

</div>

<script src="script.js"></script>

</body>
</html>
