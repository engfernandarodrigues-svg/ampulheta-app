<!DOCTYPE html>
<html lang="pt-BR">
<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Ampulheta Premium</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@300;400;500;600&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">

</head>

<body>

<div class="background-glow"></div>

<div class="container">

  <!-- LOGO -->
  <div class="logo-area">

    <img src="logo.png" class="logo">

  </div>

  <!-- SWITCH -->
  <div class="switch">

    <button class="switch-btn active" onclick="setView('hourglass')">
      Ampulheta
    </button>

    <button class="switch-btn" onclick="setView('circle')">
      Circular
    </button>

  </div>

  <!-- CARD -->
  <div class="glass-card">

    <!-- AMPULHETA -->
    <div id="hourglassView" class="view">

      <canvas id="canvas" width="320" height="470"></canvas>

    </div>

    <!-- CIRCULAR -->
    <div id="circleView" class="view hidden">

      <svg class="progress-ring" width="300" height="300">

        <circle
          class="ring-bg"
          cx="150"
          cy="150"
          r="120">
        </circle>

        <circle
          class="ring-progress"
          cx="150"
          cy="150"
          r="120">
        </circle>

      </svg>

      <div class="circle-time" id="circleTime">
        01:30
      </div>

    </div>

    <!-- TIMER -->
    <div class="timer" id="display">
      01:30
    </div>

    <div class="labels">

      <span>MINUTOS</span>
      <span>SEGUNDOS</span>

    </div>

  </div>

  <!-- PILL -->
  <div class="pill">
    ⏱ 1:30
  </div>

  <!-- CONTROLES -->
  <div class="controls">

    <button class="control primary" onclick="iniciar()">
      ▶ Iniciar
    </button>

    <button class="control" onclick="pausar()">
      ❚❚ Pausar
    </button>

    <button class="control" onclick="resetar()">
      ↻ Resetar
    </button>

  </div>

  <!-- FOOTER -->
  <div class="footer">

    <div class="footer-icon">
      ✦
    </div>

    <div class="footer-text">

      <h3>Foco, disciplina e automação</h3>

      <p>Transforme processos em resultados.</p>

    </div>

  </div>

</div>

<script src="script.js"></script>

</body>
</html>
