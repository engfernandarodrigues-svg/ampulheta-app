<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ampulheta</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
 
  <div class="wrap">
 
    <!-- Logo no lugar do título — coloque o arquivo da logo na mesma pasta com o nome logo.png -->
    <img class="logo-img" src="logo.png" alt="Automação Processos">
 
    <!-- Inputs de tempo -->
    <div class="inputs">
      <div class="ig">
        <label for="inp-min">Min</label>
        <input id="inp-min" type="number" min="0" max="99" value="1">
      </div>
      <span class="colon">:</span>
      <div class="ig">
        <label for="inp-seg">Seg</label>
        <input id="inp-seg" type="number" min="0" max="59" value="15">
      </div>
    </div>
 
    <!-- Atalhos de tempo -->
    <div class="atalhos">
      <button class="atl" onclick="setTempo(1,15)">1:15</button>
      <button class="atl" onclick="setTempo(1,30)">1:30</button>
      <button class="atl" onclick="setTempo(2,0)">2:00</button>
    </div>
 
    <!-- Botões principais -->
    <div class="btns">
      <button class="btn start" onclick="iniciar()">Iniciar</button>
      <button class="btn" onclick="pausar()">Pausar</button>
      <button class="btn" onclick="resetar()">Resetar</button>
    </div>
 
    <!-- Display do tempo -->
    <div class="display" id="disp">01:15</div>
 
    <!-- Canvas da ampulheta -->
    <canvas id="cv" width="240" height="380"></canvas>
 
    <!-- Penalidade (aparece só quando o tempo zera) -->
    <div class="penalidade" id="pen">
      <div class="pen-txt">Ih, vou ter que trazer bolo!</div>
      <svg class="bolo" width="160" height="160" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
        <rect x="74" y="20" width="7" height="22" rx="3" fill="#e8a0c0"/>
        <ellipse cx="77" cy="18" rx="5" ry="7" fill="#ff4488"/>
        <ellipse cx="77" cy="14" rx="3" ry="4" fill="#ffccee" class="chama" style="transform-origin:77px 20px"/>
        <rect x="93" y="14" width="7" height="26" rx="3" fill="#e8c96a"/>
        <ellipse cx="96" cy="12" rx="5" ry="7" fill="#ffaa00"/>
        <ellipse cx="96" cy="8" rx="3" ry="4.5" fill="#fff4a0" class="chama chama2" style="transform-origin:96px 14px"/>
        <rect x="112" y="22" width="7" height="20" rx="3" fill="#a0c8e8"/>
        <ellipse cx="115" cy="20" rx="5" ry="7" fill="#2299ee"/>
        <ellipse cx="115" cy="16" rx="3" ry="4" fill="#d0eeff" class="chama chama3" style="transform-origin:115px 22px"/>
        <ellipse cx="100" cy="58" rx="72" ry="13" fill="#c0392b"/>
        <path d="M46 60 Q43 72 46 80 Q49 72 46 60" fill="#e74c3c"/>
        <path d="M62 57 Q58 70 61 80 Q64 70 62 57" fill="#e74c3c"/>
        <rect x="28" y="58" width="144" height="50" rx="3" fill="#e74c3c"/>
        <path d="M28 75 Q55 90 82 75 Q100 65 118 75 Q145 90 172 75 L172 72 Q145 87 118 72 Q100 62 82 72 Q55 87 28 72Z" fill="rgba(0,0,0,.12)"/>
        <circle cx="55" cy="80" r="6" fill="#fff" opacity=".45"/>
        <circle cx="78" cy="72" r="5" fill="#ffe0e0" opacity=".5"/>
        <circle cx="102" cy="78" r="7" fill="#fff" opacity=".4"/>
        <circle cx="128" cy="70" r="5" fill="#ffe0e0" opacity=".5"/>
        <circle cx="152" cy="79" r="6" fill="#fff" opacity=".42"/>
        <ellipse cx="100" cy="108" rx="68" ry="10" fill="#c0792a"/>
        <rect x="32" y="108" width="136" height="54" rx="3" fill="#e8940e"/>
        <path d="M32 125 Q58 140 84 125 Q100 115 116 125 Q142 140 168 125 L168 122 Q142 137 116 122 Q100 112 84 122 Q58 137 32 122Z" fill="rgba(0,0,0,.1)"/>
        <circle cx="60" cy="133" r="5" fill="#fff" opacity=".38"/>
        <circle cx="88" cy="127" r="6" fill="#ffd" opacity=".42"/>
        <circle cx="114" cy="134" r="5" fill="#fff" opacity=".38"/>
        <circle cx="142" cy="128" r="5" fill="#ffd" opacity=".40"/>
        <ellipse cx="100" cy="162" rx="68" ry="9" fill="#a06008"/>
        <text x="100" y="150" text-anchor="middle" font-size="14" fill="#5a3200" font-family="serif" font-weight="bold" opacity=".65">BOLO</text>
      </svg>
      <div class="pen-sub">Você estourou o tempo — a rodada é sua!</div>
    </div>
 
  </div>
 
  <script src="script.js"></script>
</body>
</html>
