<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ampulheta</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Lato:wght@300;400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="app">
    <div class="logo-container">
      <img src="logo.png" alt="Logo" class="logo">
    </div>
    
    <div class="controls">
      <div class="time-inputs">
        <div class="input-group">
          <label for="minutos">Min</label>
          <input type="number" id="minutos" min="0" max="99" value="0" placeholder="00">
        </div>
        <span class="sep">:</span>
        <div class="input-group">
          <label for="segundos">Seg</label>
          <input type="number" id="segundos" min="0" max="59" value="60" placeholder="00">
        </div>
      </div>

      <div class="buttons">
        <button class="btn primary" onclick="iniciar()">Iniciar</button>
        <button class="btn" onclick="pausar()">Pausar</button>
        <button class="btn" onclick="resetar()">Resetar</button>
      </div>
    </div>

    <div class="display" id="display">00:00</div>

    <canvas id="hg" width="220" height="340"></canvas>

    <div class="done-msg" id="done"></div>

    <div class="penalidade" id="penalidade">
      <p class="penalidade-texto">Ih, vou ter que trazer bolo!</p>
      <svg class="bolo-svg" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
        <g class="vela" id="vela1">
          <rect x="93" y="18" width="6" height="22" rx="2" fill="#e8c96a"/>
          <ellipse cx="96" cy="16" rx="5" ry="7" fill="#ffaa00" opacity="0.9"/>
          <ellipse cx="96" cy="13" rx="3" ry="4" fill="#fff4a0" opacity="0.8"/>
        </g>
        <g class="vela" id="vela2">
          <rect x="73" y="22" width="5" height="18" rx="2" fill="#e8a0c0"/>
          <ellipse cx="75" cy="20" rx="4" ry="6" fill="#ff6699" opacity="0.9"/>
          <ellipse cx="75" cy="17" rx="2.5" ry="3.5" fill="#ffe0f0" opacity="0.8"/>
        </g>
        <g class="vela" id="vela3">
          <rect x="113" y="24" width="5" height="16" rx="2" fill="#a0c8e8"/>
          <ellipse cx="115" cy="22" rx="4" ry="6" fill="#4499dd" opacity="0.9"/>
          <ellipse cx="115" cy="19" rx="2.5" ry="3.5" fill="#d0eaff" opacity="0.8"/>
        </g>
        <ellipse cx="100" cy="68" rx="72" ry="12" fill="#c0392b"/>
        <rect x="28" y="68" width="144" height="44" rx="4" fill="#e74c3c"/>
        <rect x="28" y="68" width="144" height="44" rx="4" fill="url(#listra)" opacity="0.18"/>
        <defs>
          <pattern id="listra" patternUnits="userSpaceOnUse" width="18" height="18" patternTransform="rotate(45)">
            <rect width="9" height="18" fill="#fff"/>
          </pattern>
        </defs>
        <rect x="36" y="112" width="128" height="48" rx="4" fill="#f39c12"/>
        <rect x="36" y="112" width="128" height="48" rx="4" fill="url(#listra2)" opacity="0.15"/>
        <defs>
          <pattern id="listra2" patternUnits="userSpaceOnUse" width="18" height="18" patternTransform="rotate(45)">
            <rect width="9" height="18" fill="#fff"/>
          </pattern>
        </defs>
        <ellipse cx="100" cy="112" rx="64" ry="9" fill="#e67e22"/>
        <ellipse cx="100" cy="68" rx="72" ry="12" fill="#e74c3c"/>
        <path d="M28 72 Q55 85 82 72 Q100 62 118 72 Q145 85 172 72 L172 68 Q145 80 118 68 Q100 58 82 68 Q55 80 28 68 Z" fill="#c0392b" opacity="0.5"/>
        <ellipse cx="100" cy="160" rx="64" ry="9" fill="#d68910"/>
        <path d="M36 120 Q60 132 84 120 Q100 112 116 120 Q140 132 164 120 L164 116 Q140 128 116 116 Q100 108 84 116 Q60 128 36 116 Z" fill="#e67e22" opacity="0.5"/>
        <circle cx="58" cy="90" r="5" fill="#fff" opacity="0.5"/>
        <circle cx="80" cy="83" r="4" fill="#ffe0e0" opacity="0.55"/>
        <circle cx="105" cy="88" r="6" fill="#fff" opacity="0.45"/>
        <circle cx="130" cy="81" r="4" fill="#ffe0e0" opacity="0.5"/>
        <circle cx="150" cy="90" r="5" fill="#fff" opacity="0.45"/>
        <circle cx="62" cy="133" r="5" fill="#fff" opacity="0.40"/>
        <circle cx="90" cy="128" r="6" fill="#ffd" opacity="0.45"/>
        <circle cx="118" cy="135" r="5" fill="#fff" opacity="0.40"/>
        <circle cx="145" cy="130" r="4" fill="#ffd" opacity="0.40"/>
        <text x="100" y="147" text-anchor="middle" font-size="13" fill="#7a3e00" font-family="serif" font-weight="bold" opacity="0.7">BOLO</text>
      </svg>
      <p class="penalidade-sub">Você estourou o tempo! A rodada é sua. 🎂</p>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
